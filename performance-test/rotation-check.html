<!doctype html><meta charset="utf-8"><title>Phone rotation layout check</title>
<style>body{font:16px system-ui;background:#edf1f6;color:#18243a}button{font:inherit;padding:10px;margin:4px}iframe{display:block;border:1px solid #888}pre{white-space:pre-wrap}</style>
<h1>Phone rotation layout check</h1><button id="portrait">Portrait 390 × 700</button><button id="landscape">Landscape 844 × 390</button>
<pre id="result">Waiting for preview…</pre><iframe id="game" src="../preview-fast2/?ui=filltest" style="width:390px;height:700px" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('game'),out=document.getElementById('result');
document.getElementById('portrait').onclick=()=>{frame.style.width='390px';frame.style.height='700px';};
document.getElementById('landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px';};
setInterval(()=>{try{const w=frame.contentWindow,c=w.document.getElementById('canvas');if(!c)return;const r=c.getBoundingClientRect();out.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],game:[r.width,r.height],position:[r.x,r.y],backing:[c.width,c.height],fillsViewport:Math.abs(r.width-w.innerWidth)<1&&Math.abs(r.height-w.innerHeight)<1,started:w.document.title==='Trials and Trolls'},null,2);}catch(e){out.textContent=e.message;}},500);
</script>
